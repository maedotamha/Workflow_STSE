<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>FlowDesk — Approval Workflow</title>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/react/18.2.0/umd/react.development.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/react-dom/18.2.0/umd/react-dom.development.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/babel-standalone/7.23.2/babel.min.js"></script>
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
  <style>
    * { font-family: 'Inter', system-ui, sans-serif; box-sizing: border-box; }
    body { margin: 0; background: #0f0f1a; }

    /* Animations */
    @keyframes fadeUp   { from { opacity:0; transform:translateY(20px); } to { opacity:1; transform:none; } }
    @keyframes fadeIn   { from { opacity:0; } to { opacity:1; } }
    @keyframes scaleIn  { from { opacity:0; transform:scale(0.95); } to { opacity:1; transform:scale(1); } }
    @keyframes slideIn  { from { opacity:0; transform:translateX(-16px); } to { opacity:1; transform:none; } }
    @keyframes pulse    { 0%,100% { opacity:1; } 50% { opacity:.5; } }
    @keyframes shimmer  { from { background-position:-400px 0; } to { background-position:400px 0; } }
    @keyframes spin     { to { transform: rotate(360deg); } }

    .fade-up    { animation: fadeUp  0.4s cubic-bezier(.16,1,.3,1) both; }
    .fade-in    { animation: fadeIn  0.3s ease both; }
    .scale-in   { animation: scaleIn 0.25s cubic-bezier(.16,1,.3,1) both; }
    .slide-in   { animation: slideIn 0.3s cubic-bezier(.16,1,.3,1) both; }

    .skeleton {
      background: linear-gradient(90deg, #1e1e2e 25%, #2a2a3e 50%, #1e1e2e 75%);
      background-size: 400px 100%;
      animation: shimmer 1.4s infinite;
      border-radius: 8px;
    }

    /* Login gradient background */
    .login-bg {
      background: radial-gradient(ellipse at 20% 50%, rgba(99,102,241,0.15) 0%, transparent 60%),
                  radial-gradient(ellipse at 80% 20%, rgba(168,85,247,0.12) 0%, transparent 50%),
                  radial-gradient(ellipse at 60% 80%, rgba(59,130,246,0.1) 0%, transparent 50%),
                  #0f0f1a;
    }

    /* Sidebar */
    .sidebar { background: #13131f; border-right: 1px solid rgba(255,255,255,0.06); }

    /* Glass card */
    .glass {
      background: rgba(255,255,255,0.03);
      border: 1px solid rgba(255,255,255,0.08);
      backdrop-filter: blur(12px);
    }

    /* Scrollbar */
    ::-webkit-scrollbar { width: 5px; height: 5px; }
    ::-webkit-scrollbar-track { background: transparent; }
    ::-webkit-scrollbar-thumb { background: rgba(255,255,255,0.1); border-radius: 99px; }
    ::-webkit-scrollbar-thumb:hover { background: rgba(255,255,255,0.2); }

    /* Card hover */
    .req-card { transition: transform 0.18s ease, box-shadow 0.18s ease, border-color 0.18s ease; }
    .req-card:hover { transform: translateY(-2px); }

    /* User card hover */
    .user-card { transition: all 0.2s cubic-bezier(.16,1,.3,1); cursor: pointer; }
    .user-card:hover { transform: translateY(-3px); }

    /* Spinner */
    .spinner { display: inline-block; width: 18px; height: 18px; border: 2px solid rgba(255,255,255,0.3); border-top-color: white; border-radius: 50%; animation: spin 0.7s linear infinite; }

    /* Input focus glow */
    .input-glow:focus { box-shadow: 0 0 0 3px rgba(99,102,241,0.25); outline: none; }

    /* Toast */
    .toast-enter { animation: fadeUp 0.35s cubic-bezier(.16,1,.3,1) both; }

    /* Nav item */
    .nav-item { transition: background 0.15s, color 0.15s; }
    .nav-item:hover { background: rgba(255,255,255,0.05); }
    .nav-item.active { background: rgba(99,102,241,0.2); color: #818cf8; }

    /* Stat card */
    .stat-card { transition: all 0.2s ease; cursor: pointer; }
    .stat-card:hover { border-color: rgba(99,102,241,0.4) !important; }
    .stat-card.active { border-color: #6366f1 !important; background: rgba(99,102,241,0.08) !important; }

    /* Modal backdrop */
    .modal-bg { background: rgba(0,0,0,0.7); backdrop-filter: blur(8px); }

    /* Priority colors */
    .p-high   { color: #f87171; background: rgba(239,68,68,0.12);   border-color: rgba(239,68,68,0.25); }
    .p-medium { color: #fb923c; background: rgba(251,146,60,0.12);  border-color: rgba(251,146,60,0.25); }
    .p-low    { color: #34d399; background: rgba(52,211,153,0.12);  border-color: rgba(52,211,153,0.25); }

    /* Status colors */
    .s-submitted  { color: #60a5fa; background: rgba(96,165,250,0.12);  border-color: rgba(96,165,250,0.25); }
    .s-in_review  { color: #c084fc; background: rgba(192,132,252,0.12); border-color: rgba(192,132,252,0.25); }
    .s-approved   { color: #34d399; background: rgba(52,211,153,0.12);  border-color: rgba(52,211,153,0.25); }
    .s-rejected   { color: #f87171; background: rgba(248,113,113,0.12); border-color: rgba(248,113,113,0.25); }
    .s-archived   { color: #94a3b8; background: rgba(148,163,184,0.08); border-color: rgba(148,163,184,0.15); }
  </style>
</head>
<body>
<div id="root"></div>

<script type="text/babel">
const { useState, useEffect, useCallback, useRef } = React;

const API = '/api';

// ─── Data ────────────────────────────────────────────────────────────────────

const USERS = [
  {
    id: 'alice', name: 'Alice Mercer', role: 'requester', actor: 'Alice (Requester)',
    avatar: 'AM', gradient: 'from-blue-500 to-cyan-400',
    title: 'Operations Manager',
    desc: 'Submit new approval requests for your team or department.',
    tag: 'Can submit requests',
    tagColor: 'text-blue-400 bg-blue-400/10 border-blue-400/20',
    accentColor: '#60a5fa',
    password: 'alice123',
  },
  {
    id: 'carol', name: 'Carol Singh', role: 'reviewer', actor: 'Carol (Reviewer)',
    avatar: 'CS', gradient: 'from-purple-500 to-violet-400',
    title: 'Senior Analyst',
    desc: 'Review submitted requests and pass them to the approver.',
    tag: 'Can review requests',
    tagColor: 'text-purple-400 bg-purple-400/10 border-purple-400/20',
    accentColor: '#c084fc',
    password: 'carol123',
  },
  {
    id: 'david', name: 'David Okafor', role: 'approver', actor: 'David (Approver)',
    avatar: 'DO', gradient: 'from-emerald-500 to-teal-400',
    title: 'Department Director',
    desc: 'Give final approval or rejection on reviewed requests.',
    tag: 'Can approve / reject',
    tagColor: 'text-emerald-400 bg-emerald-400/10 border-emerald-400/20',
    accentColor: '#34d399',
    password: 'david123',
  },
  {
    id: 'eve', name: 'Eve Nakamura', role: 'admin', actor: 'Eve (Admin)',
    avatar: 'EN', gradient: 'from-rose-500 to-pink-400',
    title: 'System Administrator',
    desc: 'Oversee all requests and archive completed approvals.',
    tag: 'Full access',
    tagColor: 'text-rose-400 bg-rose-400/10 border-rose-400/20',
    accentColor: '#f87171',
    password: 'eve123',
  },
];

const STATUS_META = {
  submitted: { label: 'Submitted',  dot: 'bg-blue-400',   cls: 's-submitted',  icon: '↑', step: 0 },
  in_review: { label: 'In Review',  dot: 'bg-purple-400', cls: 's-in_review',  icon: '◎', step: 1 },
  approved:  { label: 'Approved',   dot: 'bg-emerald-400',cls: 's-approved',   icon: '✓', step: 2 },
  rejected:  { label: 'Rejected',   dot: 'bg-red-400',    cls: 's-rejected',   icon: '✕', step: 2 },
  archived:  { label: 'Archived',   dot: 'bg-slate-400',  cls: 's-archived',   icon: '▣', step: 3 },
};

const CATEGORIES = ['General','Finance','HR','IT','Legal','Procurement','Facilities'];
const WORKFLOW_STEPS = ['Request','Review','Approve','Archive'];

// ─── Utils ────────────────────────────────────────────────────────────────────

function timeAgo(iso) {
  const d = Math.floor((Date.now() - new Date(iso)) / 1000);
  if (d < 60)    return 'just now';
  if (d < 3600)  return `${Math.floor(d/60)}m ago`;
  if (d < 86400) return `${Math.floor(d/3600)}h ago`;
  return `${Math.floor(d/86400)}d ago`;
}
function fmtDate(iso) {
  return new Date(iso).toLocaleDateString('en-US',{month:'short',day:'numeric',year:'numeric'});
}
function fmtTime(iso) {
  return new Date(iso).toLocaleTimeString('en-US',{hour:'2-digit',minute:'2-digit'});
}

async function apiFetch(path, opts = {}) {
  const res = await fetch(`${API}${path}`, {
    headers: { 'Content-Type': 'application/json' },
    ...opts,
    body: opts.body ? JSON.stringify(opts.body) : undefined,
  });
  if (!res.ok) {
    const err = await res.json().catch(() => ({ error: res.statusText }));
    throw new Error(err.error || 'API error');
  }
  return res.json();
}

// ─── Small components ─────────────────────────────────────────────────────────

function Avatar({ user, size = 'md' }) {
  const sizes = { sm:'w-7 h-7 text-xs', md:'w-9 h-9 text-sm', lg:'w-12 h-12 text-base', xl:'w-16 h-16 text-xl' };
  return (
    <div className={`${sizes[size]} rounded-xl bg-gradient-to-br ${user.gradient} flex items-center justify-center font-bold text-white flex-shrink-0 shadow-lg`}>
      {user.avatar}
    </div>
  );
}

function Badge({ status }) {
  const m = STATUS_META[status];
  if (!m) return null;
  return (
    <span className={`inline-flex items-center gap-1.5 px-2.5 py-1 rounded-lg border text-xs font-semibold ${m.cls}`}>
      <span className={`w-1.5 h-1.5 rounded-full ${m.dot}`} />
      {m.label}
    </span>
  );
}

function PriBadge({ priority }) {
  const map = { high:['p-high','High'], medium:['p-medium','Med'], low:['p-low','Low'] };
  const [cls, label] = map[priority] || map.medium;
  return <span className={`inline-flex items-center px-2 py-0.5 rounded-md border text-xs font-semibold ${cls}`}>{label}</span>;
}

function Spinner() { return <span className="spinner" />; }

// ─── Toast ────────────────────────────────────────────────────────────────────

function Toast({ toasts, remove }) {
  return (
    <div className="fixed bottom-6 right-6 z-[100] flex flex-col gap-2 pointer-events-none">
      {toasts.map(t => (
        <div key={t.id} className={`toast-enter pointer-events-auto flex items-center gap-3 px-4 py-3 rounded-2xl shadow-2xl text-sm font-medium text-white min-w-[260px]
          ${t.type==='success' ? 'bg-emerald-600' : t.type==='error' ? 'bg-red-600' : 'bg-indigo-600'}`}>
          <span className="text-base">{t.type==='success'?'✓':t.type==='error'?'✕':'i'}</span>
          <span className="flex-1">{t.message}</span>
          <button onClick={() => remove(t.id)} className="opacity-60 hover:opacity-100 text-lg leading-none">×</button>
        </div>
      ))}
    </div>
  );
}

function useToast() {
  const [toasts, setToasts] = useState([]);
  const add = useCallback((message, type='success') => {
    const id = Date.now();
    setToasts(p => [...p, { id, message, type }]);
    setTimeout(() => setToasts(p => p.filter(t => t.id !== id)), 4000);
  }, []);
  const remove = useCallback(id => setToasts(p => p.filter(t => t.id !== id)), []);
  return { toasts, add, remove };
}

// ─── Workflow Tracker ─────────────────────────────────────────────────────────

function WorkflowTracker({ status }) {
  const step = STATUS_META[status]?.step ?? 0;
  const isRejected = status === 'rejected';
  return (
    <div className="flex items-center w-full select-none">
      {WORKFLOW_STEPS.map((label, i) => {
        const done    = i < step;
        const current = i === step;
        const future  = i > step;
        const rejected = isRejected && i === 2;
        return (
          <React.Fragment key={label}>
            <div className="flex flex-col items-center gap-1.5 flex-shrink-0">
              <div className={`w-8 h-8 rounded-full flex items-center justify-center text-xs font-bold border-2 transition-all
                ${done    ? 'bg-indigo-500 border-indigo-500 text-white shadow-lg shadow-indigo-500/30' : ''}
                ${current && !isRejected ? 'bg-transparent border-indigo-400 text-indigo-400 ring-4 ring-indigo-500/15' : ''}
                ${future  ? 'bg-transparent border-white/10 text-white/20' : ''}
                ${rejected ? 'bg-red-500/20 border-red-400 text-red-400' : ''}
              `}>
                {done ? '✓' : rejected ? '✕' : i+1}
              </div>
              <span className={`text-[10px] font-semibold whitespace-nowrap
                ${done ? 'text-indigo-400' : current && !isRejected ? 'text-white' : 'text-white/25'}
                ${rejected ? 'text-red-400' : ''}
              `}>
                {rejected ? 'Rejected' : label}
              </span>
            </div>
            {i < WORKFLOW_STEPS.length - 1 && (
              <div className={`flex-1 h-px mx-2 mb-4 transition-all ${i < step ? 'bg-indigo-500' : 'bg-white/8'}`} />
            )}
          </React.Fragment>
        );
      })}
    </div>
  );
}

// ─── Login Screen ─────────────────────────────────────────────────────────────

function LoginScreen({ onLogin }) {
  const [selected, setSelected] = useState(null);
  const [password, setPassword] = useState('');
  const [showPw,   setShowPw]   = useState(false);
  const [error,    setError]    = useState('');
  const [loading,  setLoading]  = useState(false);
  const pwRef = useRef(null);

  function selectUser(id) {
    setSelected(id);
    setPassword('');
    setError('');
    setTimeout(() => pwRef.current?.focus(), 80);
  }

  function handleLogin(e) {
    e && e.preventDefault();
    if (!selected) return;
    const user = USERS.find(u => u.id === selected);
    if (password !== user.password) {
      setError('Incorrect password. Please try again.');
      setPassword('');
      pwRef.current?.focus();
      return;
    }
    setError('');
    setLoading(true);
    setTimeout(() => { setLoading(false); onLogin(user); }, 700);
  }

  return (
    <div className="min-h-screen login-bg flex items-center justify-center p-6">
      <div className="w-full max-w-2xl">
        {/* Brand */}
        <div className="text-center mb-10 fade-up">
          <div className="inline-flex items-center justify-center w-14 h-14 rounded-2xl bg-indigo-600 shadow-xl shadow-indigo-600/40 mb-4">
            <svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="white" strokeWidth="2.2" strokeLinecap="round" strokeLinejoin="round">
              <path d="M9 11l3 3L22 4"/><path d="M21 12v7a2 2 0 01-2 2H5a2 2 0 01-2-2V5a2 2 0 012-2h11"/>
            </svg>
          </div>
          <h1 className="text-3xl font-bold text-white tracking-tight">FlowDesk</h1>
          <p className="text-white/40 mt-1.5 text-sm">Approval Workflow Management</p>
        </div>

        {/* Card */}
        <div className="glass rounded-3xl p-8 fade-up" style={{animationDelay:'0.1s'}}>
          <p className="text-white/60 text-sm font-medium mb-5">Sign in as</p>

          {/* User cards */}
          <div className="grid grid-cols-1 sm:grid-cols-2 gap-3 mb-5">
            {USERS.map((u, i) => (
              <button key={u.id} onClick={() => selectUser(u.id)}
                style={{animationDelay: `${0.15 + i*0.06}s`}}
                className={`user-card fade-up text-left p-4 rounded-2xl border-2 transition-all
                  ${selected === u.id
                    ? 'border-indigo-500 bg-indigo-500/10 shadow-lg shadow-indigo-500/20'
                    : 'border-white/8 bg-white/3 hover:border-white/20 hover:bg-white/5'}`}>
                <div className="flex items-center gap-3 mb-3">
                  <Avatar user={u} size="md" />
                  <div className="flex-1 min-w-0">
                    <p className="text-white font-semibold text-sm truncate">{u.name}</p>
                    <p className="text-white/40 text-xs truncate">{u.title}</p>
                  </div>
                  {selected === u.id && (
                    <div className="w-5 h-5 rounded-full bg-indigo-500 flex items-center justify-center flex-shrink-0">
                      <svg width="10" height="10" viewBox="0 0 10 10" fill="none">
                        <path d="M2 5l2.5 2.5L8 3" stroke="white" strokeWidth="1.5" strokeLinecap="round" strokeLinejoin="round"/>
                      </svg>
                    </div>
                  )}
                </div>
                <p className="text-white/40 text-xs leading-relaxed mb-2.5">{u.desc}</p>
                <span className={`inline-flex items-center px-2 py-0.5 rounded-md border text-xs font-semibold ${u.tagColor}`}>
                  {u.tag}
                </span>
              </button>
            ))}
          </div>

          {/* Password field — appears once a user is selected */}
          <form onSubmit={handleLogin} className="space-y-3">
            <div className={`transition-all duration-300 overflow-hidden ${selected ? 'max-h-40 opacity-100' : 'max-h-0 opacity-0'}`}>
              <div className="relative">
                <input
                  ref={pwRef}
                  type={showPw ? 'text' : 'password'}
                  value={password}
                  onChange={e => { setPassword(e.target.value); setError(''); }}
                  placeholder="Enter your password"
                  className="w-full bg-white/5 border border-white/10 rounded-xl px-4 py-3 text-sm text-white placeholder-white/20 input-glow focus:border-indigo-500/60 transition-colors pr-11"
                />
                <button type="button" onClick={() => setShowPw(p => !p)}
                  className="absolute right-3 top-1/2 -translate-y-1/2 text-white/30 hover:text-white/60 transition-colors text-sm select-none">
                  {showPw ? '🙈' : '👁️'}
                </button>
              </div>
              {error && (
                <div className="flex items-center gap-2 bg-red-500/10 border border-red-500/20 rounded-xl px-3 py-2.5 text-red-400 text-xs font-medium mt-2">
                  <span>⚠</span> {error}
                </div>
              )}
            </div>

            <button type="submit" disabled={!selected || !password || loading}
              className={`w-full py-3.5 rounded-2xl font-semibold text-sm transition-all flex items-center justify-center gap-2
                ${selected && password ? 'bg-indigo-600 hover:bg-indigo-500 text-white shadow-lg shadow-indigo-600/30 active:scale-[0.98]'
                                       : 'bg-white/5 text-white/20 cursor-not-allowed'}`}>
              {loading ? <><Spinner /> Signing in...</> : 'Sign In →'}
            </button>
          </form>
        </div>

        <p className="text-center text-white/20 text-xs mt-6 fade-up" style={{animationDelay:'0.4s'}}>
          FlowDesk · Request → Review → Approve → Archive
        </p>
      </div>
    </div>
  );
}

// ─── New Request Modal ────────────────────────────────────────────────────────

function NewRequestModal({ user, onClose, onCreated }) {
  const [form, setForm] = useState({ title:'', description:'', priority:'medium', category:'General' });
  const [loading, setLoading] = useState(false);
  const [error, setError]     = useState('');

  async function submit(e) {
    e.preventDefault();
    if (!form.title.trim() || !form.description.trim()) { setError('Title and description are required.'); return; }
    setLoading(true);
    try {
      const r = await apiFetch('/requests', { method:'POST', body: { ...form, requester: user.actor } });
      onCreated(r);
    } catch(e) { setError(e.message); } finally { setLoading(false); }
  }

  const Field = ({ label, children }) => (
    <div>
      <label className="block text-xs font-semibold text-white/50 uppercase tracking-wider mb-1.5">{label}</label>
      {children}
    </div>
  );

  const inputCls = "w-full bg-white/5 border border-white/10 rounded-xl px-4 py-2.5 text-sm text-white placeholder-white/20 input-glow focus:border-indigo-500/60 transition-colors";

  return (
    <div className="fixed inset-0 z-50 flex items-center justify-center modal-bg fade-in p-4" onClick={e => e.target===e.currentTarget && onClose()}>
      <div className="w-full max-w-lg bg-[#16161f] border border-white/10 rounded-3xl shadow-2xl scale-in overflow-hidden">
        {/* Header */}
        <div className="px-6 pt-6 pb-5 border-b border-white/6">
          <div className="flex items-center justify-between">
            <div>
              <h2 className="text-lg font-bold text-white">New Request</h2>
              <p className="text-white/40 text-xs mt-0.5">Submit for approval workflow</p>
            </div>
            <button onClick={onClose} className="w-8 h-8 rounded-xl bg-white/5 hover:bg-white/10 flex items-center justify-center text-white/40 hover:text-white transition-all">✕</button>
          </div>
        </div>

        <form onSubmit={submit} className="p-6 space-y-4">
          <Field label="Title">
            <input value={form.title} onChange={e => setForm(p=>({...p,title:e.target.value}))}
              placeholder="e.g. Q3 Budget Increase Request"
              className={inputCls} />
          </Field>

          <Field label="Description">
            <textarea value={form.description} onChange={e => setForm(p=>({...p,description:e.target.value}))}
              rows={3} placeholder="Describe what you need and why..."
              className={`${inputCls} resize-none`} />
          </Field>

          <div className="grid grid-cols-2 gap-3">
            <Field label="Priority">
              <select value={form.priority} onChange={e => setForm(p=>({...p,priority:e.target.value}))} className={inputCls}>
                <option value="high">🔴 High</option>
                <option value="medium">🟡 Medium</option>
                <option value="low">🟢 Low</option>
              </select>
            </Field>
            <Field label="Category">
              <select value={form.category} onChange={e => setForm(p=>({...p,category:e.target.value}))} className={inputCls}>
                {CATEGORIES.map(c => <option key={c} value={c}>{c}</option>)}
              </select>
            </Field>
          </div>

          {error && (
            <div className="flex items-center gap-2 bg-red-500/10 border border-red-500/20 rounded-xl px-3 py-2.5 text-red-400 text-sm">
              <span>⚠</span> {error}
            </div>
          )}

          <div className="flex gap-3 pt-1">
            <button type="button" onClick={onClose}
              className="flex-1 py-3 rounded-xl border border-white/10 text-white/50 hover:text-white hover:border-white/20 text-sm font-medium transition-all">
              Cancel
            </button>
            <button type="submit" disabled={loading}
              className="flex-1 py-3 rounded-xl bg-indigo-600 hover:bg-indigo-500 text-white text-sm font-semibold shadow-lg shadow-indigo-600/30 transition-all flex items-center justify-center gap-2 active:scale-[0.98] disabled:opacity-50">
              {loading ? <><Spinner /> Submitting...</> : '↑ Submit Request'}
            </button>
          </div>
        </form>
      </div>
    </div>
  );
}

// ─── Action Modal ─────────────────────────────────────────────────────────────

function ActionModal({ request, user, onClose, onActioned }) {
  const [comment, setComment] = useState('');
  const [loading, setLoading] = useState(false);
  const [error,   setError]   = useState('');

  const ACTIONS = {
    reviewer: { submitted: [{ to:'in_review', label:'Start Review', icon:'◎', cls:'bg-purple-600 hover:bg-purple-500 shadow-purple-600/30' }] },
    approver: { in_review: [
      { to:'approved', label:'Approve', icon:'✓', cls:'bg-emerald-600 hover:bg-emerald-500 shadow-emerald-600/30' },
      { to:'rejected', label:'Reject',  icon:'✕', cls:'bg-red-600 hover:bg-red-500 shadow-red-600/30' },
    ]},
    admin: { approved: [{ to:'archived', label:'Archive', icon:'▣', cls:'bg-slate-600 hover:bg-slate-500 shadow-slate-600/30' }] },
  };

  const actions = ACTIONS[user.role]?.[request.status] || [];

  async function act(targetStatus) {
    setLoading(true);
    try {
      const r = await apiFetch(`/requests/${request.id}/action`, {
        method:'PATCH', body: { role:user.role, targetStatus, actor:user.actor, comment }
      });
      onActioned(r);
    } catch(e) { setError(e.message); } finally { setLoading(false); }
  }

  return (
    <div className="fixed inset-0 z-50 flex items-center justify-center modal-bg fade-in p-4" onClick={e => e.target===e.currentTarget && onClose()}>
      <div className="w-full max-w-md bg-[#16161f] border border-white/10 rounded-3xl shadow-2xl scale-in overflow-hidden">
        <div className="px-6 pt-6 pb-5 border-b border-white/6">
          <div className="flex items-center justify-between">
            <h2 className="text-lg font-bold text-white">Take Action</h2>
            <button onClick={onClose} className="w-8 h-8 rounded-xl bg-white/5 hover:bg-white/10 flex items-center justify-center text-white/40 hover:text-white transition-all">✕</button>
          </div>
        </div>

        <div className="p-6 space-y-4">
          {/* Request preview */}
          <div className="bg-white/3 border border-white/8 rounded-2xl p-4">
            <div className="flex items-start justify-between gap-2 mb-2">
              <p className="text-white font-semibold text-sm">{request.title}</p>
              <Badge status={request.status} />
            </div>
            <p className="text-white/40 text-xs leading-relaxed">{request.description}</p>
          </div>

          {/* Comment */}
          <div>
            <label className="block text-xs font-semibold text-white/50 uppercase tracking-wider mb-1.5">Comment <span className="normal-case font-normal">(optional)</span></label>
            <textarea value={comment} onChange={e => setComment(e.target.value)}
              rows={2} placeholder="Add a note about your decision..."
              className="w-full bg-white/5 border border-white/10 rounded-xl px-4 py-2.5 text-sm text-white placeholder-white/20 input-glow focus:border-indigo-500/60 transition-colors resize-none" />
          </div>

          {error && <div className="bg-red-500/10 border border-red-500/20 rounded-xl px-3 py-2.5 text-red-400 text-sm">⚠ {error}</div>}

          {actions.length === 0 ? (
            <p className="text-center text-white/30 text-sm py-3">No actions available for your role.</p>
          ) : (
            <div className="flex gap-2.5">
              <button onClick={onClose} className="flex-1 py-3 rounded-xl border border-white/10 text-white/50 hover:text-white hover:border-white/20 text-sm font-medium transition-all">
                Cancel
              </button>
              {actions.map(a => (
                <button key={a.to} onClick={() => act(a.to)} disabled={loading}
                  className={`flex-1 py-3 rounded-xl text-white text-sm font-semibold shadow-lg transition-all flex items-center justify-center gap-1.5 active:scale-[0.98] disabled:opacity-50 ${a.cls}`}>
                  {loading ? <Spinner /> : <><span>{a.icon}</span>{a.label}</>}
                </button>
              ))}
            </div>
          )}
        </div>
      </div>
    </div>
  );
}

// ─── Blockchain Trail (per request) ──────────────────────────────────────────

function BlockchainTrail({ requestId }) {
  const [blocks,  setBlocks]  = useState([]);
  const [loading, setLoading] = useState(true);

  useEffect(() => {
    apiFetch(`/blockchain/request/${requestId}`)
      .then(d => setBlocks(d.blocks.filter(b => b.data.requestId !== 'GENESIS')))
      .catch(() => {})
      .finally(() => setLoading(false));
  }, [requestId]);

  if (loading) return <div className="skeleton h-20 rounded-xl" style={{background:'rgba(255,255,255,0.04)'}} />;

  return (
    <div className="space-y-2">
      {blocks.map((block, i) => (
        <div key={block.index} className="bg-black/20 border border-emerald-500/15 rounded-xl p-3.5 fade-in">
          <div className="flex items-center justify-between mb-2">
            <div className="flex items-center gap-2">
              <span className="text-[10px] font-bold text-emerald-400 bg-emerald-400/10 border border-emerald-400/20 px-2 py-0.5 rounded-md">
                BLOCK #{block.index}
              </span>
              <span className="text-[10px] text-white/30 capitalize">{block.data.action.replace('_',' ')}</span>
            </div>
            <span className="text-[10px] text-white/20">{fmtDate(block.timestamp)} · {fmtTime(block.timestamp)}</span>
          </div>

          <div className="space-y-1.5 font-mono">
            <div className="flex items-start gap-2">
              <span className="text-[10px] text-white/25 w-20 flex-shrink-0">Hash</span>
              <span className="text-[10px] text-emerald-400 break-all leading-relaxed">{block.hash}</span>
            </div>
            <div className="flex items-start gap-2">
              <span className="text-[10px] text-white/25 w-20 flex-shrink-0">Prev Hash</span>
              <span className="text-[10px] text-white/30 break-all leading-relaxed">{block.previousHash}</span>
            </div>
            <div className="flex items-start gap-2">
              <span className="text-[10px] text-white/25 w-20 flex-shrink-0">Actor</span>
              <span className="text-[10px] text-white/50">{block.data.actor}</span>
            </div>
            {block.data.fromStatus && (
              <div className="flex items-center gap-2">
                <span className="text-[10px] text-white/25 w-20 flex-shrink-0">Transition</span>
                <span className="text-[10px] text-white/50">{block.data.fromStatus} → {block.data.toStatus}</span>
              </div>
            )}
            <div className="flex items-center gap-2">
              <span className="text-[10px] text-white/25 w-20 flex-shrink-0">Nonce</span>
              <span className="text-[10px] text-white/30">{block.nonce}</span>
            </div>
          </div>

          {i < blocks.length - 1 && (
            <div className="flex justify-center mt-2">
              <div className="text-emerald-500/40 text-xs">↓ chained to</div>
            </div>
          )}
        </div>
      ))}
      {blocks.length === 0 && (
        <p className="text-white/20 text-xs text-center py-4">No blockchain records yet</p>
      )}
    </div>
  );
}
